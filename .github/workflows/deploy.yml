name: Deploy UIUXAtlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify catalog completeness
        run: node -e "const fs=require('fs');const s=fs.readFileSync('app.js','utf8');const ids=[...s.matchAll(/pattern\(\"([^\"]+)\"/g)].map(x=>x[1]);const cases=[...s.matchAll(/case \"([^\"]+)\":inside=/g)].map(x=>x[1]);if(ids.length!==36||new Set(ids).size!==36||ids.some(id=>!cases.includes(id)))process.exit(1);console.log('36 unique catalog entries and demos validated')"
      - name: Verify static entry files
        run: test -s index.html && test -s styles.css && test -s favicon.svg
      - name: Install Chrome test driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.55.0
      - name: Smoke test in headless Chrome
        run: node tests/smoke.cjs
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
