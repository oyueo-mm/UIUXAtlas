name: Deploy UIUXAtlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: uiuxatlas-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js && node --check expansion-data.js && node --check expansion-demos.js && node --check expansion-controls.js && node --check more-data.js && node --check more-demos.js && node --check more-controls.js && node --check corrections.js && node --check within-data.js && node --check within-demos.js && node --check within-controls.js && node --check within-runtime.js && node --check focus-data.js && node --check focus-demos.js && node --check focus-controls.js && node --check focus-runtime.js
      - name: Verify retained catalog entries
        run: node tests/check-expansion.cjs
      - name: Verify unchanged 24 categories and 48 new demos
        run: node tests/check-within.cjs
      - name: Verify 40 focused additions in existing categories
        run: node tests/check-focus.cjs
      - name: Verify catalog completeness
        run: node -e "const fs=require('fs');const s=fs.readFileSync('app.js','utf8');const ids=[...s.matchAll(/pattern\(\"([^\"]+)\"/g)].map(x=>x[1]);const cases=[...s.matchAll(/case \"([^\"]+)\":inside=/g)].map(x=>x[1]);if(ids.length!==36||new Set(ids).size!==36||ids.some(id=>!cases.includes(id)))process.exit(1);console.log('36 unique catalog entries and demos validated')"
      - name: Verify static entry files
        run: test -s index.html && test -s styles.css && test -s expansion-styles.css && test -s expansion-data.js && test -s expansion-demos.js && test -s expansion-controls.js && test -s more-data.js && test -s more-demos.js && test -s more-controls.js && test -s more-styles.css && test -s corrections.js && test -s corrections.css && test -s within-data.js && test -s within-demos.js && test -s within-controls.js && test -s within-runtime.js && test -s within-styles.css && test -s focus-data.js && test -s focus-demos.js && test -s focus-controls.js && test -s focus-runtime.js && test -s focus-styles.css && test -s favicon.svg
      - name: Install Chrome test driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.55.0
      - name: Smoke test in headless Chrome
        run: node tests/smoke.cjs
      - name: Audit animations and reduced motion
        run: node tests/audit-motion.cjs
      - name: Regression test animation correctness
        run: node tests/motion-regression.cjs
      - name: Audit geometric accuracy of animated paths
        run: node tests/geometry-audit.cjs
      - name: Test 48 new previews and interactions
        run: node tests/check-within-browser.cjs
      - name: Test 40 focused additions and live workflows
        run: node tests/check-focus-browser.cjs
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
